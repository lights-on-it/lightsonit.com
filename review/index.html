<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Division 26 | Design Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Oswald:wght@500&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1EEE7;--ink:#23262B;--muted:#66625B;--hair:#DAD2C4;--accent:#3E4C59}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:56px 24px}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:56px;height:56px}
h1{font-size:2.2rem;line-height:1;letter-spacing:-.02em;margin:0}
.label{font-family:"Courier Prime",ui-monospace,monospace;text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;color:var(--muted);margin:.5rem 0 0}
.open{display:inline-block;margin-top:36px;font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:.95rem;padding:14px 26px;background:var(--accent);color:#F1EEE7;text-decoration:none}
.open:hover{background:var(--ink)}
.palette{display:flex;flex-wrap:wrap;gap:20px 40px;margin-top:48px;padding-top:28px;border-top:1px solid var(--hair)}
.palette .label{margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:10px 18px}
.chip{display:flex;align-items:center;gap:8px;font-size:.9rem;line-height:1.25}
.chip i{width:30px;height:30px;border:1px solid rgba(0,0,0,.12);flex:none}
.chip small{display:block;font-family:"Courier Prime",monospace;color:var(--muted);font-size:.72rem}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">
    <img src="assets/logo.png" alt="Division 26">
    <div>
      <h1>Division 26</h1>
      <p class="label">Design review</p>
    </div>
  </div>
  <a class="open" href="masthead/slate-dispatch/index.html">Open the site</a>
  <div class="palette">
    <div>
      <p class="label">Slate and stone</p>
      <div class="chips"><span class="chip"><i style="background:#F1EEE7"></i><span>Paper<small>#F1EEE7</small></span></span><span class="chip"><i style="background:#E4DCCF"></i><span>Stone<small>#E4DCCF</small></span></span><span class="chip"><i style="background:#BFB3A3"></i><span>Tan<small>#BFB3A3</small></span></span><span class="chip"><i style="background:#3E4C59"></i><span>Slate<small>#3E4C59</small></span></span><span class="chip"><i style="background:#23262B"></i><span>Ink<small>#23262B</small></span></span></div>
    </div>
    <div>
      <p class="label">Author colors</p>
      <div class="chips"><span class="chip"><i style="background:#2E6E69"></i><span>Jonathan Dixon<small>#2E6E69</small></span></span><span class="chip"><i style="background:#9B1B12"></i><span>Gregg Owen<small>#9B1B12</small></span></span></div>
    </div>
  </div>
</main>
</body>
</html>
